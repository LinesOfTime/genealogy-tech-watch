<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лицензии — Genealogy Tech Watch</title><style>body{font:15px/1.65 system-ui;background:#0c1422;color:#eaf0f8;max-width:1050px;margin:0 auto;padding:28px}a{color:#a1d8f1}nav{display:flex;gap:20px;flex-wrap:wrap}input{width:100%;box-sizing:border-box;padding:12px;background:#192c40;color:#fff;border:1px solid #4a647b;border-radius:9px}.item{background:#17283c;border:1px solid #35516a;border-radius:12px;padding:16px 20px;margin:12px 0}.meta{color:#b3c8d8;font-size:13px}h1{line-height:1.2}h2{margin:0 0 8px;font-size:19px}p{margin:8px 0}</style><link rel="stylesheet" href="navigation.css?v=20261024"></head><body><nav class="site-nav" aria-label="Основная навигация"><div class="site-nav__links"><a href="index.html">Каталог проектов</a><a href="digest.html">Дайджест</a><a href="licenses.html" aria-current="page">Лицензии</a><a href="priorities.html">Приоритеты</a><a href="tasks.html">Подобрать по задаче</a></div></nav><main class="reference-content"><h1>Справочник лицензий</h1><p>Лицензия исходного кода, документации и данных может различаться. Наличие файла LICENSE ещё не подтверждает его содержание. Условия необходимо проверять в конкретной версии репозитория.</p><input id="q" placeholder="Поиск по лицензиям"><div id="items"></div><script>
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rules=[[/^MIT(?:\b| \()/i,['MIT','Разрешительная лицензия: обычно допускает использование, изменение и распространение, в том числе коммерческое, при сохранении уведомлений об авторстве и лицензии.','https://opensource.org/license/mit']],[/^Apache-2\.0/i,['Apache License 2.0','Разрешительная лицензия с условиями уведомления об изменениях и положениями о патентных правах.','https://www.apache.org/licenses/LICENSE-2.0']],[/^BSD-3-Clause/i,['BSD 3-Clause','Разрешительная лицензия с требованием сохранения уведомлений и ограничением использования имён авторов для продвижения.','https://opensource.org/license/bsd-3-clause']],[/^MPL-2\.0/i,['Mozilla Public License 2.0','Слабый copyleft на уровне файлов: изменённые файлы под MPL обычно остаются под MPL при распространении.','https://www.mozilla.org/en-US/MPL/2.0/']],[/^EUPL-1\.2/i,['European Union Public Licence 1.2','Свободная copyleft-лицензия ЕС с отдельными правилами совместимости.','https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12']],[/^AGPL/i,['GNU AGPL','Сильный copyleft; для модифицированного ПО, доступного пользователям по сети, могут возникать обязанности предоставить соответствующий исходный код. Точная версия и суффикс важны.','https://www.gnu.org/licenses/agpl-3.0.html']],[/^GPL/i,['GNU GPL','Сильный copyleft при распространении производных программ; различайте версии и формулировки only / or-later.','https://www.gnu.org/licenses/gpl-3.0.html']],[/^CC0/i,['CC0','Инструмент отказа от прав в максимально допустимой законом степени; обычно применяется к данным и контенту, не как замена проверке лицензии программного кода.','https://creativecommons.org/publicdomain/zero/1.0/']],[/^CC[- ]BY[- ]NC/i,['Creative Commons BY-NC','Лицензия на контент с ограничением некоммерческого использования; не является лицензией открытого исходного кода.','https://creativecommons.org/licenses/by-nc-sa/4.0/']],[/^CC[- ]BY[- ]SA/i,['Creative Commons BY-SA','Лицензия на контент с указанием авторства и сохранением аналогичных условий для адаптаций.','https://creativecommons.org/licenses/by-sa/4.0/']],[/^CC[- ]BY/i,['Creative Commons BY','Лицензия на контент с указанием авторства; сама по себе не устанавливает условия для программного кода.','https://creativecommons.org/licenses/by/4.0/']],[/^PolyForm/i,['PolyForm Noncommercial','Лицензия с ограничением некоммерческого использования; не следует обозначать как OSI open source.','https://polyformproject.org/licenses/noncommercial/1.0.0/']]];
function desc(s){if(/не определена|не установлена|не подтверждена|не уточнена/i.test(s))return ['Не установлена','Достаточных подтверждений конкретной лицензии нет. Нельзя считать код свободным для повторного использования без проверки правообладателя и условий.',''];if(/смешанн|отдельн|преимущественно|;/.test(s))return ['Смешанные условия','В одном репозитории могут действовать разные лицензии для кода, документации, данных и зависимостей. Проверяйте каждую часть отдельно.',''];return (rules.find(x=>x[0].test(s))||[null,['Требует проверки','Нужно прочитать полный текст условий в первоисточнике; краткое название может быть неполным.','']])[1]}
let all=[];fetch('catalog.json').then(r=>r.json()).then(data=>{const m=new Map;for(const x of data){let k=x.license||'Не установлена';m.set(k,(m.get(k)||0)+1)}all=[...m].sort((a,b)=>b[1]-a[1]);const selected=new URLSearchParams(location.search).get('license');if(selected)document.getElementById('q').value=selected;render();});document.getElementById('q').addEventListener('input',render);function render(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('items').innerHTML=all.filter(x=>x[0].toLowerCase().includes(q)).map(([name,n])=>{let [type,detail,url]=desc(name);return '<article class="item"><h2>'+E(name)+'</h2><div class="meta">'+n+' проектов · '+E(type)+'</div><p>'+E(detail)+'</p>'+(url?'<a href="'+E(url)+'" target="_blank" rel="noopener noreferrer">Официальный текст ↗</a>':'')+'</article>'}).join('')||'<p>Совпадений нет.</p>'}
</script></main></body></html>
