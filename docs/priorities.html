<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приоритеты — Genealogy Tech Watch</title><style>body{font:15px/1.65 system-ui;background:#0c1422;color:#eaf0f8;max-width:1050px;margin:0 auto;padding:28px}a{color:#a1d8f1}nav{display:flex;gap:20px;flex-wrap:wrap}input{width:100%;box-sizing:border-box;padding:12px;background:#192c40;color:#fff;border:1px solid #4a647b;border-radius:9px}.item{background:#17283c;border:1px solid #35516a;border-radius:12px;padding:16px 20px;margin:12px 0}.meta{color:#b3c8d8;font-size:13px}h1{line-height:1.2}h2{margin:0 0 8px;font-size:19px}p{margin:8px 0}</style></head><body><nav><a href="index.html">← Каталог</a><a href="digest.html">Дайджест</a><a href="licenses.html">Лицензии</a><a href="priorities.html">Приоритеты</a></nav><h1>Как понимать приоритеты</h1><p>Приоритет — редакционная оценка интереса для дальнейшего изучения, а не рейтинг качества, безопасности, зрелости или достоверности проекта.</p><div id="items"></div><script>const meanings={'P1':'Высокий приоритет: изучить в первую очередь, если задача соответствует направлению.','P2':'Средний приоритет: перспективно для следующего этапа исследования.','P3':'Низкий приоритет: отложенное или нишевое направление.','A':'Высокий исследовательский интерес в исходной шкале A/B/C.','B':'Средний исследовательский интерес в исходной шкале A/B/C.','C':'Низкий или специализированный исследовательский интерес в исходной шкале A/B/C.'};fetch('catalog.json').then(r=>r.json()).then(data=>{let m=new Map;for(let x of data){let k=x.priority||'Не назначен';m.set(k,(m.get(k)||0)+1)}let selected=new URLSearchParams(location.search).get('priority');document.getElementById('items').innerHTML=[...m].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,n])=>'<article class="item"'+(k===selected?' style="border-color:#a1d8f1"':'')+'><h2>'+k+'</h2><p>'+ (meanings[k]||'Шкала не документирована; требуется редакционная расшифровка.') +'</p><p class="meta">Проектов: '+n+'</p><a href="index.html">Перейти в каталог →</a></article>').join('')})</script></body></html>
