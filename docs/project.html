<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Исследование проекта — Линии времени</title><style>:root{color-scheme:dark;font:15px/1.65 system-ui;background:#0c1422;color:#eaf0f8}*{box-sizing:border-box}body{margin:0}header{background:#192e45;border-bottom:1px solid #39516a;padding:28px max(20px,calc((100vw - 1050px)/2))}main{max-width:1090px;margin:auto;padding:25px 20px 80px}a{color:#9cdbef}nav{display:flex;gap:20px}.panel{background:#17283c;border:1px solid #36516b;border-radius:13px;padding:18px 22px;margin:14px 0}h1{font-size:clamp(26px,4vw,40px)}h2{font-size:20px;margin:0 0 8px}p{margin:8px 0;color:#d1e0eb;white-space:pre-wrap}.muted{font-size:12px;color:#abc1d2}.entry{border-left:2px solid #587c99;padding-left:14px;margin:18px 0}small{color:#abc5d7}</style></head><body><header><nav><a href="index.html">← Каталог</a><a href="digest.html">Дайджест</a><a href="licenses.html">Лицензии</a><a href="priorities.html">Приоритеты</a></nav><h1 id="title">Исследование проекта</h1><p id="subtitle"></p></header><main><div id="content">Загрузка…</div></main><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const para=x=>'<p>'+esc(x||'Сведения пока не установлены')+'</p>';
const panel=(title,body)=>'<section class="panel"><h2>'+esc(title)+'</h2>'+body+'</section>';
const safeUrl=x=>/^https:\/\/(github\.com|www\.github\.com)\//i.test(x||'')?x:'';
const link=(url,label)=>safeUrl(url)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">'+esc(label)+' ↗</a>':'';
(async()=>{try{const [catalog,research,digest]=await Promise.all([fetch('catalog.json').then(r=>r.json()),fetch('research.json').then(r=>r.json()),fetch('digest.json').then(r=>r.json())]);let requested=(new URLSearchParams(location.search).get('repo')||'').toLowerCase();let x=catalog.find(v=>v.name.toLowerCase()===requested);if(!x)throw Error('Проект не найден: '+requested);let r=research[requested]||{};document.title=x.name+' — исследование';document.getElementById('title').textContent=x.name;document.getElementById('subtitle').textContent=x.section+' · приоритет '+x.priority;let html=panel('Назначение и архитектурная роль',para(r.project_type||x.description)+para(r.editorial_summary||''))+panel('Практическое применение',para(r.editorial_use_case||x.use_case))+panel('Ограничения и редакционная оценка',para(r.editorial_limitations||x.limitations)+para(r.audit_notes||''));if(r.guide_excerpt)html+=panel('Из путеводителя от 10 октября 2026',para(r.guide_excerpt)+'<small>Редакционное описание, не результат нового независимого тестирования.</small>');html+=panel('Лицензия и проверка',para('Лицензия: '+(r.license||x.license||'Не определена'))+para('Статус: '+(r.license_status||x.license_status||'Не подтверждён'))+para('Основание: '+(r.license_evidence||'Не указано'))+para('Открытость: '+(r.opensource_status||'Не установлена'))+para('Аудит: '+(r.audit_status||'Не указан'))+para('Метод проверки: '+(r.verification_basis||x.verification||'Не указан'))+para('Дата: '+(r.verification_date||x.verified_at||'Не указана'))+para('Тестирование: '+(/не тестировалось|не проводилось/i.test(r.test_status||x.test_status||'')?'Независимое тестирование не проводилось':(r.test_status||x.test_status||'Статус не установлен')))+link(x.url,'Репозиторий'));let ev=[...(x.history||[])];for(let day of digest)for(let item of day.items||[])if(item.repo.toLowerCase()===requested)ev.push({date:day.date,change:item.change,action:item.action,url:item.link});ev.sort((a,b)=>String(b.date).localeCompare(String(a.date)));let seen=new Set;html+=panel('Хронология исследований',ev.map(e=>{let k=e.date+'|'+e.change;if(seen.has(k))return '';seen.add(k);return '<div class="entry"><small>'+esc(e.date)+'</small>'+para(e.change)+(e.action?para('Рекомендация: '+e.action):'')+link(e.url,'Источник изменения')+'</div>'}).join('')||para('Пока нет отдельных датированных обновлений'));html+=panel('Происхождение сведений',para('Редакционный реестр от 8 октября 2026; путеводитель от 10 октября 2026; записи GitHub Watch, если имеются. Не следует трактовать описания как независимую проверку заявленных функций.'));document.getElementById('content').innerHTML=html}catch(e){document.getElementById('content').textContent='Ошибка: '+e.message}})();
</script></body></html>
