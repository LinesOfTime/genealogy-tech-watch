name: Priority Review Queue
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run priority queue tests
        run: python3 -m unittest discover -s tests -p 'test_priority_review_queue.py' -v
      - name: Test full catalog audit
        run: python3 -m unittest discover -s tests -p 'test_github_metadata_audit.py' -v
      - name: Audit every GitHub project (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/github_metadata_audit.py --output github-metadata-audit.json
      - name: Generate review queue
        run: python3 tools/priority_review_queue.py --max-age 90 --output priority-review-queue.json
      - name: Summarize queue
        run: |
          python3 - <<'PY'
          import json, os
          from collections import Counter
          report=json.load(open('priority-review-queue.json',encoding='utf-8'))
          counts=Counter(reason for item in report['items'] for reason in item['reasons'])
          groups=Counter(item['review_group'] for item in report['items'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('# Очередь переоценки приоритетов\n\n')
              f.write(f"Каталог: {report['catalog_count']}; требуют проверки: {report['queue_count']}\n\n")
              for reason, count in sorted(counts.items()):
                  f.write(f"- {reason}: {count}\n")
              f.write('\nГруппы работы:\n')
              for group, count in sorted(groups.items()):
                  f.write(f'- {group}: {count}\n')
              f.write('\nПолный JSON — в артефакте запуска. Оценки не менялись.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: priority-review-queue
          path: |\n            priority-review-queue.json\n            github-metadata-audit.json
          retention-days: 30
