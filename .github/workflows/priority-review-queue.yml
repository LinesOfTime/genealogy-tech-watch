name: Priority Review Queue
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test priority review queue
        run: python3 -m unittest discover -s tests -p 'test_priority_review_queue.py' -v
      - name: Test GitHub metadata audit
        run: python3 -m unittest discover -s tests -p 'test_github_metadata_audit.py' -v
      - name: Generate priority review queue
        run: python3 tools/priority_review_queue.py --max-age 90 --output priority-review-queue.json
      - name: Audit all catalog repositories
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/github_metadata_audit.py --output github-metadata-audit.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: priority-review-queue
          path: |
            priority-review-queue.json
            github-metadata-audit.json
          if-no-files-found: warn
          retention-days: 30
