name: Watch Updater

on:
  push:
    branches:
      - 'watch-inbox/**'
  workflow_dispatch:
    inputs:
      package_commit:
        description: Commit SHA containing watch-package.json
        type: string
        required: true
      mode:
        description: Preview or publish after reviewing the diff
        type: choice
        options: [preview, publish]
        default: preview
        required: true
      approval_hash:
        description: Approval hash from the reviewed preview (publish only)
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: watch-updater-main
  cancel-in-progress: false

jobs:
  automatic:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/watch-inbox/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: watch-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Validate and preview immutable inbox commit
        env:
          PACKAGE_COMMIT: ${{ github.sha }}
        run: |
          python3 tools/watch_updater.py --package-commit "$PACKAGE_COMMIT" \
            --diff "$RUNNER_TEMP/watch-preview.diff" > "$RUNNER_TEMP/watch-preview.json"
          cat "$RUNNER_TEMP/watch-preview.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-preview
          path: |
            ${{ runner.temp }}/watch-preview.json
            ${{ runner.temp }}/watch-preview.diff
          retention-days: 7
      - name: Apply validated package
        env:
          PACKAGE_COMMIT: ${{ github.sha }}
          REVIEWER: ${{ github.actor }}
        run: |
          APPROVAL_HASH=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["approval_hash"])' "$RUNNER_TEMP/watch-preview.json")
          python3 tools/watch_updater.py --package-commit "$PACKAGE_COMMIT" \
            --publish --expect "$APPROVAL_HASH" --actor "$REVIEWER"
      - name: Publish to main
        env:
          PAGES_PUSH_TOKEN: ${{ secrets.WATCH_PUBLISH_TOKEN }}
          PACKAGE_COMMIT: ${{ github.sha }}
        run: |
          test -n "$PAGES_PUSH_TOKEN"
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote" = "$(git rev-parse HEAD)"
          git -c user.name="Watch Updater" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Watch: apply validated package" -m "Package: $PACKAGE_COMMIT"
          git -c credential.helper= \
            -c 'credential.helper=!f() { printf "username=x-access-token\\npassword=%s\\n" "$PAGES_PUSH_TOKEN"; }; f' \
            push origin HEAD:refs/heads/main

  preview:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate and preview
        env:
          PACKAGE_COMMIT: ${{ inputs.package_commit }}
        run: |
          python3 tools/watch_updater.py --package-commit "$PACKAGE_COMMIT" \
            --diff "$RUNNER_TEMP/watch-preview.diff" > "$RUNNER_TEMP/watch-preview.json"
          cat "$RUNNER_TEMP/watch-preview.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watch-preview
          path: |
            ${{ runner.temp }}/watch-preview.json
            ${{ runner.temp }}/watch-preview.diff
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: watch-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check approval, apply and validate staged data
        env:
          PACKAGE_COMMIT: ${{ inputs.package_commit }}
          APPROVAL_HASH: ${{ inputs.approval_hash }}
          REVIEWER: ${{ github.triggering_actor }}
        run: |
          python3 tools/watch_updater.py --package-commit "$PACKAGE_COMMIT" \
            --publish --expect "$APPROVAL_HASH" --actor "$REVIEWER"
      - name: Publish checked data to main
        env:
          PAGES_PUSH_TOKEN: ${{ secrets.WATCH_PUBLISH_TOKEN }}
          PACKAGE_COMMIT: ${{ inputs.package_commit }}
          APPROVAL_HASH: ${{ inputs.approval_hash }}
        run: |
          test -n "$PAGES_PUSH_TOKEN"
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git -c user.name="Watch Updater" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Watch: apply approved package" \
            -m "Package: $PACKAGE_COMMIT" -m "Approval: $APPROVAL_HASH"
          git -c credential.helper= \
            -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$PAGES_PUSH_TOKEN"; }; f' \
            push origin HEAD:refs/heads/main
          git rev-parse HEAD
